<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper:#EDEFE9;
    --paper-line:#D9DCD1;
    --ink:#1B2A20;
    --forest:#1F3D2B;
    --forest-dim:#2E5A3E;
    --brass:#A9793F;
    --red:#9C3B2E;
    --card:#F6F7F3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--paper);
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px);
    background-size: 100% 2.1rem;
    color:var(--ink);
    font-family:'IBM Plex Mono', monospace;
  }
  h1,h2,.serif{font-family:'Fraunces', serif;}
  .wrap{max-width:560px;margin:0 auto;padding:2.4rem 1.5rem 4rem;}

  /* --- Login --- */
  #login-view{
    max-width:380px;margin:5rem auto 0;padding:0 1.5rem;
  }
  .brand{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:2rem;
    letter-spacing:-0.02em;
    color:var(--forest);
    margin:0 0 .2rem;
  }
  .brand-sub{
    font-size:.8rem;
    color:var(--brass);
    letter-spacing:.08em;
    text-transform:uppercase;
    margin-bottom:2.2rem;
  }
  label{display:block;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--forest-dim);margin-bottom:.35rem;}
  input{
    width:100%;
    padding:.7rem .8rem;
    font-family:'IBM Plex Mono', monospace;
    font-size:.95rem;
    border:1px solid var(--paper-line);
    background:var(--card);
    color:var(--ink);
    border-radius:2px;
    margin-bottom:1.1rem;
  }
  input:focus{outline:2px solid var(--forest);outline-offset:1px;}
  button{
    font-family:'IBM Plex Mono', monospace;
    font-weight:500;
    font-size:.85rem;
    letter-spacing:.04em;
    cursor:pointer;
    border:none;
    border-radius:2px;
    padding:.75rem 1.1rem;
  }
  .btn-primary{background:var(--forest);color:var(--paper);width:100%;}
  .btn-primary:hover{background:var(--forest-dim);}
  #login-error{color:var(--red);font-size:.8rem;margin-top:.5rem;min-height:1.2em;}

  /* --- Dashboard --- */
  .top-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:1.8rem;}
  .signout{background:none;color:var(--forest-dim);text-decoration:underline;padding:0;font-size:.75rem;}

  .net-card{
    background:var(--card);
    border:1px solid var(--paper-line);
    border-left:4px solid var(--forest);
    padding:1.6rem 1.4rem;
    margin-bottom:1.8rem;
  }
  .net-label{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--brass);margin-bottom:.4rem;}
  .net-amount{font-family:'Fraunces', serif;font-weight:700;font-size:2.4rem;line-height:1;color:var(--forest);}
  .net-amount.negative{color:var(--red);}
  .net-meta{font-size:.75rem;color:var(--forest-dim);margin-top:.5rem;}

  form#add-form{
    background:var(--card);
    border:1px solid var(--paper-line);
    padding:1.3rem 1.4rem 0.6rem;
    margin-bottom:2rem;
  }
  .type-toggle{display:flex;gap:.5rem;margin-bottom:1.1rem;}
  .type-btn{
    flex:1;
    background:var(--paper);
    border:1px solid var(--paper-line);
    color:var(--forest-dim);
    padding:.6rem;
  }
  .type-btn.active[data-type="income"]{background:var(--forest);color:var(--paper);border-color:var(--forest);}
  .type-btn.active[data-type="withdrawal"]{background:var(--red);color:var(--paper);border-color:var(--red);}

  .ledger-title{font-family:'Fraunces', serif;font-size:1.1rem;margin:0 0 .8rem;color:var(--forest);}
  .txn{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding:.75rem 0;
    border-bottom:1px solid var(--paper-line);
    font-size:.85rem;
  }
  .txn:last-child{border-bottom:none;}
  .txn-left{max-width:75%;}
  .txn-reason{color:var(--ink);}
  .txn-date{color:#8A9284;font-size:.72rem;margin-top:.15rem;}
  .txn-amount{font-weight:600;white-space:nowrap;}
  .txn-amount.income{color:var(--forest);}
  .txn-amount.withdrawal{color:var(--red);}
  .del-btn{background:none;color:#8A9284;font-size:.7rem;padding:0;margin-top:.2rem;text-decoration:underline;}
  .empty{color:#8A9284;font-size:.85rem;padding:1rem 0;}
  .hidden{display:none !important;}
</style>
</head>
<body>

<div id="login-view">
  <div class="brand">Ledger</div>
  <div class="brand-sub">private income &amp; withdrawal log</div>
  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="username" />
  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password" />
  <button class="btn-primary" id="login-btn">Sign in</button>
  <div id="login-error"></div>
</div>

<div id="dashboard-view" class="wrap hidden">
  <div class="top-row">
    <span class="brand serif" style="font-size:1.4rem;">Ledger</span>
    <button class="signout" id="signout-btn">Sign out</button>
  </div>

  <div class="net-card">
    <div class="net-label">Net this month</div>
    <div class="net-amount" id="net-amount">0.00</div>
    <div class="net-meta" id="net-meta"></div>
  </div>

  <form id="add-form">
    <div class="type-toggle">
      <button type="button" class="type-btn active" data-type="income">+ Income</button>
      <button type="button" class="type-btn" data-type="withdrawal">− Withdrawal</button>
    </div>
    <label for="amount">Amount</label>
    <input id="amount" type="number" step="0.01" min="0.01" placeholder="0.00" required />
    <label for="reason">Reason <span id="reason-hint" style="text-transform:none;color:#8A9284;">(optional for income)</span></label>
    <input id="reason" type="text" placeholder="e.g. client payment, rent, groceries" />
    <button class="btn-primary" id="add-btn" type="submit" style="margin-bottom:1.2rem;">Add entry</button>
  </form>

  <div class="ledger-title">Recent entries</div>
  <div id="txn-list"></div>
</div>

<script>
  // --- Supabase setup ---
  const SUPABASE_URL = "https://qkzxypgslaxaxzyntues.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_WX_TErN2VJbUVUSNWWJTmA_IPn6KOka";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const loginView = document.getElementById('login-view');
  const dashView = document.getElementById('dashboard-view');
  const loginError = document.getElementById('login-error');

  let currentType = 'income';

  // --- Auth ---
  document.getElementById('login-btn').addEventListener('click', async () => {
    loginError.textContent = '';
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) loginError.textContent = error.message;
  });

  document.getElementById('signout-btn').addEventListener('click', async () => {
    await sb.auth.signOut();
  });

  sb.auth.onAuthStateChange((_event, session) => {
    if (session) {
      loginView.classList.add('hidden');
      dashView.classList.remove('hidden');
      loadTransactions();
    } else {
      dashView.classList.add('hidden');
      loginView.classList.remove('hidden');
    }
  });

  // --- Type toggle ---
  document.querySelectorAll('.type-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentType = btn.dataset.type;
      document.getElementById('reason-hint').style.display = currentType === 'income' ? 'inline' : 'none';
      document.getElementById('reason').required = currentType === 'withdrawal';
    });
  });

  // --- Add entry ---
  document.getElementById('add-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const amount = parseFloat(document.getElementById('amount').value);
    const reason = document.getElementById('reason').value.trim();
    if (!amount || amount <= 0) return;
    if (currentType === 'withdrawal' && !reason) {
      alert('Please add a reason for the withdrawal.');
      return;
    }
    const { data: userData } = await sb.auth.getUser();
    const { error } = await sb.from('transactions').insert({
      user_id: userData.user.id,
      type: currentType,
      amount,
      reason: reason || null
    });
    if (error) { alert(error.message); return; }
    document.getElementById('amount').value = '';
    document.getElementById('reason').value = '';
    loadTransactions();
  });

  // --- Load + render ---
  async function loadTransactions() {
    const { data, error } = await sb
      .from('transactions')
      .select('*')
      .order('created_at', { ascending: false })
      .limit(100);
    if (error) { console.error(error); return; }
    renderNet(data);
    renderList(data);
  }

  function renderNet(rows) {
    const now = new Date();
    const monthRows = rows.filter(r => {
      const d = new Date(r.created_at);
      return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    });
    const income = monthRows.filter(r => r.type === 'income').reduce((s, r) => s + Number(r.amount), 0);
    const withdrawals = monthRows.filter(r => r.type === 'withdrawal').reduce((s, r) => s + Number(r.amount), 0);
    const net = income - withdrawals;
    const el = document.getElementById('net-amount');
    el.textContent = (net < 0 ? '-' : '') + Math.abs(net).toFixed(2);
    el.classList.toggle('negative', net < 0);
    document.getElementById('net-meta').textContent =
      `income ${income.toFixed(2)}  ·  withdrawals ${withdrawals.toFixed(2)}`;
  }

  function renderList(rows) {
    const list = document.getElementById('txn-list');
    if (!rows.length) {
      list.innerHTML = '<div class="empty">No entries yet. Add your first one above.</div>';
      return;
    }
    list.innerHTML = rows.map(r => {
      const d = new Date(r.created_at);
      const dateStr = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
      const sign = r.type === 'income' ? '+' : '−';
      return `
        <div class="txn">
          <div class="txn-left">
            <div class="txn-reason">${r.reason ? escapeHtml(r.reason) : (r.type === 'income' ? 'Income' : 'Withdrawal')}</div>
            <div class="txn-date">${dateStr}</div>
            <button class="del-btn" data-id="${r.id}">remove</button>
          </div>
          <div class="txn-amount ${r.type}">${sign}${Number(r.amount).toFixed(2)}</div>
        </div>`;
    }).join('');
    list.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        await sb.from('transactions').delete().eq('id', btn.dataset.id);
        loadTransactions();
      });
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>
</body>
</html>
